# Metadata checks have their own cancellation domain, never code check names.
name: Task ritual

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: task-ritual-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  task-ritual:
    # Retain the skipped main-push context for default-branch App discovery.
    # Only PR events validate the current body and its linked Task ledger.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # Job permissions replace the workflow grant, including checkout access.
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Linked Task carries start claim + plan comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/check-task-ritual.sh
